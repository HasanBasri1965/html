<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Ekle</title>
  <link rel="stylesheet" href="css/2311012812.css">
</head>
<body>
  <header>
    <h1>Etkinlik Ekle</h1>
    <nav>
      <a href="index.html">Ana Sayfa</a>
      <a href="etkinlikler.html">Etkinlikler</a>
      <a href="etkinlik-ekle.html">Ekle</a>
      <a href="etkinlik-guncelle.html">Güncelle</a>
    </nav>
  </header>

  <main>
    <form action="#" method="post">
      <label for="etkinlik-adi">Etkinlik adı</label>
      <input type="text" id="etkinlik-adi" required>

      <label for="kategori">Kategori</label>
      <select id="kategori" required>
        <option value="">Seçiniz</option>
        <option value="seminer">Seminer</option>
        <option value="atolye">Atölye</option>
      </select>

      <label for="tarih">Tarih</label>
      <input type="text" id="tarih" placeholder="boş bırakıldı" required>

      <label for="aciklama">Açıklama</label>
      <textarea id="aciklama" rows="3" required></textarea>

      <button type="submit">Kaydet</button>
    </form>
  </main>
</body>
</html>
